name: measuring_wellbeing
description: "Measuring Well-Being: offline-first SDQ data collection for child protection partners in Lebanon."
publish_to: 'none'

# Shown in the app and sent to the API as the client version.
version: 2.0.1+201

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
