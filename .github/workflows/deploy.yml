name: Deploy

# Pushes to main deploy to staging automatically. Production is deployed
# on demand and waits for approval on the "production" GitHub environment.
#
# Required repository secrets:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required repository variables: AZURE_RG_STAGING, AZURE_RG_PROD, ACR_NAME_STAGING,
#   ACR_NAME_PROD, APP_PREFIX_STAGING (mwb-staging), APP_PREFIX_PROD (mwb-prod)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        default: staging
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      env_name: ${{ steps.meta.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: meta
        run: |
          ENV_NAME="${{ inputs.environment || 'staging' }}"
          if [ "$ENV_NAME" = "prod" ]; then ACR="${{ vars.ACR_NAME_PROD }}"; else ACR="${{ vars.ACR_NAME_STAGING }}"; fi
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          echo "image=$ACR.azurecr.io/measuring-wellbeing:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ steps.meta.outputs.acr }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.acr }}.azurecr.io/measuring-wellbeing:${{ steps.meta.outputs.env_name }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ needs.build.outputs.env_name }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ needs.build.outputs.env_name == 'prod' && 'production' || 'staging' }}
      url: ${{ steps.fqdn.outputs.url }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource names
        id: names
        run: |
          if [ "${{ needs.build.outputs.env_name }}" = "prod" ]; then
            echo "rg=${{ vars.AZURE_RG_PROD }}" >> "$GITHUB_OUTPUT"
            echo "prefix=${{ vars.APP_PREFIX_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "rg=${{ vars.AZURE_RG_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "prefix=${{ vars.APP_PREFIX_STAGING }}" >> "$GITHUB_OUTPUT"
          fi
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Run database migrations (Container Apps job)
        env:
          RG: ${{ steps.names.outputs.rg }}
          JOB: ${{ steps.names.outputs.prefix }}-migrate
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          az containerapp job update -g "$RG" -n "$JOB" --image "$IMAGE" --only-show-errors >/dev/null
          EXEC=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
          echo "Started execution $EXEC"
          for i in $(seq 1 120); do
            STATUS=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$EXEC" --query properties.status -o tsv)
            echo "[$i] $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "Migration job $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for migration job"; exit 1

      - name: Update container apps
        env:
          RG: ${{ steps.names.outputs.rg }}
          PREFIX: ${{ steps.names.outputs.prefix }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          for app in web worker scheduler; do
            echo "Updating $PREFIX-$app"
            az containerapp update -g "$RG" -n "$PREFIX-$app" --image "$IMAGE" \
              --revision-suffix "sha${GITHUB_SHA::7}" --only-show-errors >/dev/null
          done

      - name: Resolve URL and smoke test
        id: fqdn
        env:
          RG: ${{ steps.names.outputs.rg }}
          PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          FQDN=$(az containerapp show -g "$RG" -n "$PREFIX-web" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS "https://$FQDN/up" >/dev/null; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "Health check failed"; exit 1
