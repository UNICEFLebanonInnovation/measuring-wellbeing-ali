name: Mobile app

on:
  push:
    branches: [main, feature/**]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
    tags: ['mobile-v*']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Server address baked into the APK as the default
        default: https://measuringwellbeing.org
        required: false

env:
  FLUTTER_VERSION: 3.47.7

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git ~/flutter

      - name: Add Flutter to PATH
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed --line-length 160 lib/main.dart lib/app lib/core lib/data lib/domain lib/features lib/services test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info

  apk:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git ~/flutter

      - name: Add Flutter to PATH
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.kts', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}

      - run: flutter pub get

      # The keystore is stored base64-encoded in the ANDROID_KEYSTORE_BASE64 secret.
      # Without the secrets the APK is signed with the debug key (fine for testing,
      # but devices will refuse to upgrade from a release-signed build).
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "MW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be signed with the debug key"
          fi

      - name: Build APK
        env:
          MW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://measuringwellbeing.org' }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/measuring-wellbeing-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: measuring-wellbeing-apk
          path: mobile/build/app/outputs/flutter-apk/measuring-wellbeing-*.apk
          retention-days: 90

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable file name so the link to the latest release never changes:
          # https://github.com/<owner>/<repo>/releases/latest/download/measuring-wellbeing.apk
          cp build/app/outputs/flutter-apk/measuring-wellbeing-*.apk build/app/outputs/flutter-apk/measuring-wellbeing.apk
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Mobile app $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/measuring-wellbeing.apk build/app/outputs/flutter-apk/measuring-wellbeing-*.apk --clobber
