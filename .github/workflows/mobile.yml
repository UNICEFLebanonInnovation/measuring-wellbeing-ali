name: Mobile app

on:
  push:
    branches: [main, feature/**]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
    tags: ['mobile-v*']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Server address baked into the APK as the default
        default: https://measuringwellbeing.org
        required: false

env:
  FLUTTER_VERSION: 3.47.7

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed --line-length 160 lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info

  apk:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      # The keystore is stored base64-encoded in the ANDROID_KEYSTORE_BASE64 secret.
      # Without the secrets the APK is signed with the debug key (fine for testing,
      # but devices will refuse to upgrade from a release-signed build).
      - name: Restore release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          MW_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          MW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://measuringwellbeing.org' }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/measuring-wellbeing-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: measuring-wellbeing-apk
          path: mobile/build/app/outputs/flutter-apk/measuring-wellbeing-*.apk
          retention-days: 90

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/measuring-wellbeing-*.apk
          generate_release_notes: true
